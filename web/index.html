<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChatGPT Agent</title><style>body{font-family:system-ui;margin:0;background:#f5f5f5}.app{max-width:520px;margin:auto;padding:20px}.card{background:white;border-radius:18px;padding:18px;box-shadow:0 4px 20px #0001}textarea,input,button{width:100%;box-sizing:border-box;padding:13px;margin-top:10px;border-radius:12px;border:1px solid #ddd;font-size:16px}button{border:0;background:#111;color:white;font-weight:600}button.stop{background:#c62828}.row{display:flex;gap:10px}.row>*{flex:1}.status{margin-top:14px;padding:12px;border-radius:10px;background:#eee}</style></head><body><main class="app"><div class="card"><h2>🤖 ChatGPT Agent</h2><label>Tin nhắn</label><textarea id="message" rows="5" placeholder="Nhập nội dung cần gửi..."></textarea><div class="row"><div><label>Số lần</label><input id="count" type="number" min="1" value="1"></div><div><label>Delay (giây)</label><input id="delay" type="number" min="1" value="10"></div></div><div class="row"><button onclick="start()">▶ Bắt đầu</button><button class="stop" onclick="stop()">■ Dừng</button></div><div id="status" class="status">Đang chờ</div></div></main><script>async function post(path,body){const r=await fetch('/api/'+path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});return r.json()}async function start(){const message=document.querySelector('#message').value;if(!message)return setStatus('Hãy nhập tin nhắn');setStatus('Đang chạy...');const r=await post('start',{message,count:+document.querySelector('#count').value,delay:+document.querySelector('#delay').value});setStatus(r.message||'Đã khởi động')}async function stop(){const r=await post('stop',{});setStatus(r.message||'Đã dừng')}function setStatus(x){document.querySelector('#status').textContent=x}</script></body></html>
